/* Final navy-and-gold visual polish inspired by the supplied reference */
:root{--bg:#0b0c12;--panel:#151620;--ink:#f8f4eb;--muted:#b4a995;--line:#39313a;--nav:#0b0c12;--amber:#ffc629;--radius:22px}
body{background:radial-gradient(ellipse at 50% -10%,#27212a 0%,#101117 42%,#090a0f 100%);color:var(--ink)}

.logo{background:linear-gradient(145deg,#ffe17a,#ffb800);box-shadow:0 6px 22px #ffc62924}
.brand strong{color:#fff6df;letter-spacing:.15px}.brand small{color:#b4a995}
.nav{gap:9px}.nav button{border:1px solid transparent;border-radius:15px;color:#d6c5a5;transition:background .18s,color .18s,transform .18s}

.main{padding-top:28px}.topbar{margin-bottom:25px}.topbar h1{color:#fff4d8;font-weight:800}.sub{color:#b4a995}
.stat,.panel{background:linear-gradient(145deg,rgba(26,26,37,.98),rgba(17,18,27,.98));border:1px solid #39313a;box-shadow:0 12px 30px #0002}
.stat{border-radius:21px}.stat-top{color:#c6b99f}.stat .num{color:#ffca35}.panel{border-radius:22px}.panel h2{color:#fff1d1}.panel p{color:#b4a995}
input,select,textarea,.field{background:#11121b;border-color:#45404a;color:#fff7e8}input::placeholder,textarea::placeholder{color:#827c83}
button.primary{background:linear-gradient(135deg,#ffdc58,#f5ad08);color:#17131a;box-shadow:0 4px 14px #ffc62914}
button.light{background:#272633;color:#f8e6bd;border:1px solid #403744}
.student-card{background:linear-gradient(145deg,#1d1c28,#11121b);border-color:#39313a;box-shadow:0 9px 22px #0002}.student-card:hover{border-color:#ffc629;box-shadow:0 12px 28px #ffc62912}
.student-avatar{background:linear-gradient(145deg,#ffe16b,#f5ad08);color:#17131a}.student-balance{background:linear-gradient(135deg,#ffda4f,#f2a900);color:#19141a;box-shadow:inset 0 -5px 0 #d8900620}
.profile-kpi{background:#1a1924;border-color:#39313a}.profile-kpi strong{color:#ffca35}.callout{background:#1b1a25;border-color:#39313a;color:#eee3ce}
.badge.paid{background:#153b2d;color:#8df0bd}.badge.pending{background:#45351a;color:#ffda7b}.badge.overdue{background:#451f27;color:#ff9aa4}.badge.neutral{background:#302b39;color:#f5e9d4}
th{background:#201e29;color:#d6c5a5}td,th{border-bottom-color:#39313a}
.donut:after{background:#151620}.track,.progress{background:#34303b}.fill,.progress span{background:linear-gradient(90deg,#ffdc58,#f2a900)}
.modal{background:#151620;border-color:#39313a;box-shadow:0 22px 70px #0008}.modal-backdrop{background:#000a}
.toast{background:#201e29;border:1px solid #514331;color:#fff2d4}

/* Mobile-only stacked rows for the three requested areas; desktop tables remain unchanged. */
@media(max-width:720px){
 .mobile-cards{overflow:visible}
 .mobile-cards table,.mobile-cards tbody{display:block;width:100%;white-space:normal}
 .mobile-cards thead{display:none}
 .mobile-cards tbody tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px;padding:10px 12px;margin:0 0 10px;border:1px solid var(--line);border-radius:14px;background:#171b30}
 .mobile-cards tbody td{display:block;min-width:0;padding:8px 0;border:0;white-space:normal;overflow-wrap:anywhere}
 .mobile-cards tbody td:before{display:block;margin-bottom:4px;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.45px;text-transform:uppercase}
 .inactive-cards tbody td:nth-child(1):before{content:"Student"}.inactive-cards tbody td:nth-child(2):before{content:"Batch"}.inactive-cards tbody td:nth-child(3):before{content:"Monthly fee"}.inactive-cards tbody td:nth-child(4):before{content:"Actions"}
 .payment-cards tbody td:nth-child(1):before{content:"Date"}.payment-cards tbody td:nth-child(2):before{content:"Student"}.payment-cards tbody td:nth-child(3):before{content:"Amount"}.payment-cards tbody td:nth-child(4):before{content:"Allocated to"}.payment-cards tbody td:nth-child(5):before{content:"Method"}.payment-cards tbody td:nth-child(6):before{content:"Note / Receipt"}.payment-cards tbody td:nth-child(7):before{content:"Action"}.payment-cards tbody td:nth-child(7){grid-column:1/-1}
 .presence-cards tbody td:nth-child(1):before{content:"Student"}.presence-cards tbody td:nth-child(2):before{content:"Batch"}.presence-cards tbody td:nth-child(3):before{content:"Mark presence"}.presence-cards tbody td:nth-child(4):before{content:"Saved status"}
 .attendance-history-cards tbody td:nth-child(1):before{content:"Date"}.attendance-history-cards tbody td:nth-child(2):before{content:"Student"}.attendance-history-cards tbody td:nth-child(3):before{content:"Status"}
 .mobile-cards tbody td[colspan]{grid-column:1/-1}
 .presence-cards select{min-width:0;width:100%;padding:9px 7px;font-size:12px}
 .inactive-cards tbody td:last-child{grid-column:1/-1}
 .payment-cards tbody td:nth-child(6){grid-column:1/-1}
}

@media(max-width:720px){

 .topbar{gap:13px;margin-bottom:18px}.topbar h1{font-size:24px}.actions{gap:8px}.search{min-width:0}

/* Sign-in screen (Firebase) */
.auth{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));background:radial-gradient(ellipse at 50% -10%,#27212a 0%,#101117 42%,#090a0f 100%);overflow:auto}

.auth-card .logo{margin:0 auto 14px;height:54px;width:54px;font-size:28px;border-radius:16px}

.auth-card form{text-align:left;display:grid;gap:12px}.auth-card form button,#googleBtn{width:100%;padding:12px}
.auth-msg{min-height:18px;font-size:12px;color:#ff9aa4}.auth-msg.ok{color:#8df0bd}
.auth-link{background:none;color:#d6c5a5;font-size:12px;text-decoration:underline;margin-top:10px;padding:4px}

.auth-wait{display:none;color:#b4a995;margin-top:18px}.auth.loading .auth-body{display:none}.auth.loading .auth-wait{display:block}

<script>
const KEY='sportsAcademyFeesManager_v1';
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(Number(n)||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const monthKey=(date=today())=>date.slice(0,7);
const formatDate=value=>{if(!value)return '—';const m=String(value).match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?`${m[3]}/${m[2]}/${m[1]}`:String(value)};
const monthName=k=>{const [y,m]=k.split('-').map(Number);return `${MONTHS[m-1]} ${y}`};
let state=loadState(),page='dashboard',searchTerm='',toastTimer;
function blankState(){return {version:1,academy:'My Sports Academy',sport:'Sports',currency:'INR',students:[],payments:[],attendance:[],rollovers:[],settings:{rolloverDay:5,lastRolloverMonth:'',messageTemplate:'Hello {parentGreeting} 👋\n\nFriendly fee reminder from {academy} for {student}’s training. 🏅\n\n📅 Month: {month}\n👤 Student: {student}\n🏅 Batch: {batch}\n💳 Monthly fee: {fee}\n✅ Paid this month: {paid}\n📌 Previous dues: {previousDues}\n💰 Total outstanding: {totalOutstanding}\n\nPlease pay when convenient. Thank you!'}}}
function loadState(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.version===1)return {...blankState(),...x,settings:{...blankState().settings,...x.settings}}}catch(e){}return blankState()}
function save(){localStorage.setItem(KEY,JSON.stringify(state));if(window.cloudQueue)cloudQueue()}
function advInfo(s){const fee=Number(s.monthlyFee)||0,c=Number(s.advanceCredit)||0;return {credit:c,months:fee>0?Math.floor(c/fee):0,extra:fee>0?c%fee:c}}
function mkOff(k,n){const [y,m]=k.split('-').map(Number),d=new Date(y,m-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function advLabel(c,fee){if(c<=0)return '';if(fee<=0)return `Advance credit ${money(c)}`;const n=Math.floor(c/fee),x=c%fee,cur=thisMonth();let t=n>0?`${monthName(cur)} + ${n} more month${n>1?'s':''} paid (till ${monthName(mkOff(cur,n))})`:`${monthName(cur)} paid`;if(x>0)t+=` · Extra ${money(x)} for ${monthName(mkOff(cur,n+1))}`;return t}
function advText(s){return advLabel(Number(s.advanceCredit)||0,Number(s.monthlyFee)||0)}
function paymentPreview(s){const f=document.getElementById('paymentForm');if(!f)return '';const amt=Number(f.querySelector('[name=amount]')?.value)||0;if(amt<=0)return '';const al=f.querySelector('[name=allocation]')?.value;let rem=amt,prev=0,cur=0;const curBal=()=>Math.max(0,Number(s.monthlyFee||0)-Number(s.paidThisMonth||0));if(al==='current'){cur=Math.min(curBal(),rem);rem-=cur;prev=Math.min(Number(s.previousDue||0),rem);rem-=prev}else{prev=Math.min(Number(s.previousDue||0),rem);rem-=prev;cur=Math.min(curBal(),rem);rem-=cur}let t=`<br>This payment: previous ${money(prev)} · current ${money(cur)}`;if(rem>0){const fee=Number(s.monthlyFee)||0,tot=(Number(s.advanceCredit)||0)+rem,m=fee>0?Math.floor(tot/fee):0;t+=`<br><strong>Extra ${money(rem)} goes to advance → ${esc(advLabel(tot,fee))}</strong>`}return t}
function dueTotal(s){return Math.max(0,(Number(s.previousDue)||0)+(Number(s.monthlyFee)||0)-(Number(s.paidThisMonth)||0))}
function status(s){if(dueTotal(s)<=0)return 'Paid';return s.dueDate && s.dueDate<today()?'Overdue':'Pending'}
function activeStudents(){return state.students.filter(s=>s.active!==false)}
function thisMonth(){return monthKey()}
function collectedThisMonth(){return state.payments.filter(p=>p.date?.slice(0,7)===thisMonth()).reduce((a,p)=>a+Number(p.amount||0),0)}
function totals(){const ss=activeStudents();return {total:ss.length,active:ss.length,monthlyExpected:ss.reduce((a,s)=>a+Number(s.monthlyFee||0),0),collected:collectedThisMonth(),previous:ss.reduce((a,s)=>a+Number(s.previousDue||0),0),outstanding:ss.reduce((a,s)=>a+dueTotal(s),0),paid:ss.filter(s=>status(s)==='Paid').length,pending:ss.filter(s=>status(s)==='Pending').length,overdue:ss.filter(s=>status(s)==='Overdue').length}}
function safeRollover(){const d=new Date();const mk=monthKey();if(d.getDate()<Number(state.settings.rolloverDay||5)||state.settings.lastRolloverMonth===mk)return;const prev=new Date(d.getFullYear(),d.getMonth()-1,1);const prevKey=`${prev.getFullYear()}-${String(prev.getMonth()+1).padStart(2,'0')}`;if(!state.settings.lastRolloverMonth){state.settings.lastRolloverMonth=mk;save();return;}
 let changed=0;state.students.forEach(s=>{if(s.active===false)return;const due=Math.max(0,Number(s.monthlyFee||0)-Number(s.paidThisMonth||0));if(due>0){s.previousDue=Number(s.previousDue||0)+due;s.dueLedger=s.dueLedger||[];s.dueLedger.push({month:prevKey,amount:due,createdAt:today(),type:'rollover'});changed++}s.paidThisMonth=0;{const use=Math.min(Number(s.advanceCredit)||0,Number(s.monthlyFee)||0);if(use>0){s.paidThisMonth=use;s.advanceCredit=Number(s.advanceCredit)-use}}s.feeMonth=mk;s.status='Unpaid';});
 state.settings.lastRolloverMonth=mk;state.rollovers.push({month:mk,from:prevKey,date:today(),students:changed});save();if(changed)showToast(`Monthly rollover completed for ${monthName(prevKey)}.`)}
function init(){if(!window.FB_ON)safeRollover();render();document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.page)));document.getElementById('globalSearch').addEventListener('input',e=>{searchTerm=e.target.value; if(page==='students')render()})}
function navigate(p){page=p==='more'?'settings':p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p || (p==='more'&&b.dataset.page==='settings')));render();window.scrollTo({top:0,behavior:'smooth'})}
const pageInfo={dashboard:['Dashboard','Your academy at a glance.'],students:['Students','Manage athletes, fee plans, and previous dues.'],payments:['Payments','Record payments and track allocations.'],attendance:['Presence / Attendance','Take daily attendance and review history.'],reminders:['WhatsApp Reminders','Prepare individual or bulk reminder messages.'],reports:['Reports','Review collections, dues, and attendance.'],settings:['Settings & Backup','Academy details, local data backup, and rollover.']};
function genericSportsMigrate(){try{if(!state||!state.settings)return;let ch=false;['messageTemplate','paymentTemplate'].forEach(k=>{if(typeof state.settings[k]==='string'&&state.settings[k].includes('🏸')){state.settings[k]=state.settings[k].replace(/🏸/g,'🏅');ch=true}});if(!state.settings.genericSportsDone){state.settings.genericSportsDone=true;ch=true;if(state.sport==='Badminton')state.sport='Sports';(state.students||[]).forEach(x=>{if(x.sport==='Badminton')x.sport=''})}if(ch)save()}catch(e){console.error(e)}}
function render(){genericSportsMigrate();const info=pageInfo[page]||pageInfo.dashboard;document.getElementById('pageTitle').textContent=info[0];document.getElementById('pageSub').textContent=info[1];const root=document.getElementById('appContent');const views={dashboard:dashboardView,students:studentsView,payments:paymentsView,attendance:attendanceView,reminders:remindersView,reports:reportsView,settings:settingsView};root.innerHTML=(views[page]||dashboardView)();bindDynamic()}
function statCard(label,num,color,sub){const ic={'Total Students':'👤','Collected This Month':'💵','Overdue Fees':'🚨','Total Outstanding':'🧾','Paid Students':'✅'}[label];return `<div class="stat"><div class="stat-top">${esc(label)} <span class="dot${ic?'':' sq'}" style="--c:${label==='Expected Monthly Revenue'?'#2f7be8':color}">${ic?`<span>${ic}</span>`:''}</span></div><div class="num">${num}</div><small>${sub||''}</small></div>`}
function dashboardView(){const t=totals(),ss=activeStudents(),paidPct=t.total?Math.round(t.paid/t.total*100):0;const lastMonths=[];for(let i=5;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;lastMonths.push({k,label:MONTHS[d.getMonth()].slice(0,3),amount:state.payments.filter(p=>p.date?.slice(0,7)===k).reduce((a,p)=>a+Number(p.amount||0),0)})}const max=Math.max(1,...lastMonths.map(x=>x.amount));const dueSoon=ss.filter(s=>dueTotal(s)>0&&s.dueDate>=today()).sort((a,b)=>a.dueDate.localeCompare(b.dueDate)).slice(0,5);const overdue=ss.filter(s=>status(s)==='Overdue').slice(0,5);
return `<div class="grid stats">${statCard('Total Students',t.total,'#2563eb','All enrolled students')}${statCard('Collected This Month',money(t.collected),'#10b981',monthName(thisMonth()))}${statCard('Pending Fees',money(ss.filter(s=>status(s)==='Pending').reduce((a,s)=>a+dueTotal(s),0)),'#f59e0b',`${t.pending} students pending`)}${statCard('Overdue Fees',money(ss.filter(s=>status(s)==='Overdue').reduce((a,s)=>a+dueTotal(s),0)),'#ef4444',`${t.overdue} students overdue`)}${statCard('Expected Monthly Revenue',money(t.monthlyExpected),'#64748b','Active students × monthly fee')}${statCard('Total Outstanding',money(t.outstanding),'#ef4444','Current balance + previous dues')}${statCard('Previous Due',money(t.previous),'#f59e0b','Outstanding from earlier months')}${statCard('Paid Students',t.paid,'#10b981',`${paidPct}% of active students fully paid`)}</div>
<div class="grid two"><section class="panel"><div class="panel-head"><div><h2>Monthly Fee Collection</h2><p>Last six months</p></div></div><div class="bars">${lastMonths.map(x=>`<div class="barrow"><span>${x.label}</span><div class="track"><div class="fill" style="width:${Math.round(x.amount/max*100)}%"></div></div><strong>${money(x.amount)}</strong></div>`).join('')}</div></section>
<section class="panel"><div class="panel-head"><div><h2>Fee Status</h2><p>Current active students</p></div></div><div class="split"><div class="donut" style="--pct:${t.total?Math.round(t.paid/t.total*100):0}%" data-center="${paidPct}%"></div><div class="legend"><div><span class="dot" style="background:#10b981"></span>Paid <b>${t.paid}</b></div><div><span class="dot" style="background:#f59e0b"></span>Pending <b>${t.pending}</b></div><div><span class="dot" style="background:#ef4444"></span>Overdue <b>${t.overdue}</b></div></div></div><div class="notice" style="margin-top:16px;margin-bottom:0">Fee status is calculated from current payment and previous dues.</div></section></div>
<div class="grid two"><section class="panel"><div class="panel-head"><h2>Fees Due Soon</h2><button class="light small" onclick="navigate('students')">View students</button></div>${dueSoon.length?`<div class="table-wrap"><table><thead><tr><th>Student</th><th>Due date</th><th>Balance</th></tr></thead><tbody>${dueSoon.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(formatDate(s.dueDate))}</td><td>${money(dueTotal(s))}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">No upcoming balances.</div>`}</section>
<section class="panel"><div class="panel-head"><h2>Overdue Students</h2><button class="light small" onclick="navigate('reminders')">Remind</button></div>${overdue.length?`<div class="table-wrap"><table><thead><tr><th>Student</th><th>Balance</th><th>Status</th></tr></thead><tbody>${overdue.map(s=>`<tr><td>${esc(s.name)}</td><td>${money(dueTotal(s))}</td><td><span class="badge overdue">Overdue</span></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">No overdue fees. Great work!</div>`}</section></div>`}
function studentsView(){const allActive=state.students.filter(s=>s.active!==false),list=allActive.filter(s=>[s.name,s.parent,s.phone,s.batch,s.sport].join(' ').toLowerCase().includes(searchTerm.toLowerCase())),inactive=state.students.filter(s=>s.active===false).filter(s=>[s.name,s.parent,s.phone,s.batch,s.sport].join(' ').toLowerCase().includes(searchTerm.toLowerCase()));return `<section class="panel"><div class="panel-head"><div><h2>Student Directory</h2><p>${list.length} active students • tap a profile card to open full details</p></div><button class="primary" onclick="openStudentForm()">＋ Add Student</button></div><div class="filters"><input id="studentFilter" placeholder="Search name, parent, phone…" value="${esc(searchTerm)}"><select id="statusFilter"><option value="all">All fee statuses</option><option>Paid</option><option>Pending</option><option>Overdue</option></select><select id="batchFilter"><option value="all">All batches</option>${[...new Set(list.map(s=>s.batch).filter(Boolean))].map(b=>`<option>${esc(b)}</option>`).join('')}</select></div><div class="student-grid" id="studentRows">${list.map(studentCard).join('')||`<div class="empty">No active students found.</div>`}</div></section><section class="panel"><div class="panel-head"><div><h2>Inactive Students / Drafts</h2><p>${inactive.length} saved inactive student${inactive.length===1?'':'s'} • records are preserved</p></div></div>${inactive.length?`<div class="table-wrap mobile-cards inactive-cards"><table><thead><tr><th>Student</th><th>Batch</th><th>Monthly fee</th><th>Actions</th></tr></thead><tbody>${inactive.map(s=>`<tr><td><strong>${esc(s.name)}</strong><div class="muted">${esc(s.parent||'Parent not added')}</div></td><td>${esc(s.batch||'—')}</td><td>${money(s.monthlyFee)}</td><td><button class="light small" onclick="openStudentProfile('${s.id}')">View</button> <button class="primary small" onclick="activateStudent('${s.id}')">Activate</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">No inactive students. Students marked inactive will be saved here so you can activate them later.</div>`}</section>`}

function openStudentProfile(id){const s=state.students.find(x=>x.id===id);if(!s)return;const payments=state.payments.filter(p=>p.studentId===id).sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,8);const attends=state.attendance.filter(a=>a.studentId===id).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8);const body=`<div class="student-card-top" style="cursor:default"><div class="student-avatar" style="width:60px;height:60px;font-size:24px">${esc((s.name||'?').trim().charAt(0).toUpperCase())}</div><div style="flex:1"><h2 style="margin:0 0 4px">${esc(s.name)}</h2><div class="card-meta">${esc(s.batch||'No batch')} · ${esc(s.sport||state.sport)}</div><div style="margin-top:7px">${statusBadge(status(s))}</div>${advText(s)?`<div class="card-meta" style="color:#0f8a5f;font-weight:700;margin-top:6px">${esc(advText(s))}</div>`:''}</div></div><div class="profile-contact-actions"><button class="contact-btn call-btn" onclick="callStudent('${s.id}')"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.02-.24c1.12.37 2.33.56 3.57.56a1 1 0 011 1V20a1 1 0 01-1 1C10.61 21 3 13.39 3 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.24.19 2.45.56 3.57a1 1 0 01-.25 1.02z"/></svg>Call Student / Parent</button><button class="contact-btn wa-btn" onclick="openWhatsApp('${s.id}')"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.52 3.48A11.8 11.8 0 0012.1 0C5.55 0 .22 5.32.22 11.87c0 2.1.55 4.15 1.6 5.96L.12 24l6.32-1.66a11.9 11.9 0 005.65 1.44h.01c6.55 0 11.88-5.33 11.88-11.88 0-3.17-1.23-6.15-3.46-8.42zM12.1 21.76a9.9 9.9 0 01-5.04-1.38l-.36-.21-3.75.98 1-3.65-.24-.38a9.82 9.82 0 01-1.52-5.25c0-5.47 4.45-9.92 9.92-9.92 2.65 0 5.14 1.03 7.01 2.91a9.86 9.86 0 012.9 7.02c0 5.47-4.45 9.88-9.92 9.88zm5.44-7.42c-.3-.15-1.77-.87-2.04-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.47-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.07-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.49s1.07 2.89 1.22 3.09c.15.2 2.1 3.2 5.09 4.49.71.31 1.27.49 1.7.63.71.23 1.36.2 1.87.12.57-.08 1.77-.72 2.02-1.42.25-.7.25-1.3.17-1.42-.07-.12-.27-.2-.57-.35z"/></svg>WhatsApp</button></div><div class="profile-kpis" style="margin-top:16px"><div class="profile-kpi"><span class="muted">Total outstanding</span><strong>${money(dueTotal(s))}</strong></div><div class="profile-kpi"><span class="muted">Monthly fee</span><strong>${money(s.monthlyFee)}</strong></div><div class="profile-kpi"><span class="muted">Paid this month</span><strong>${money(s.paidThisMonth)}</strong></div></div><div class="profile-section"><h3>Student details</h3><div class="form-grid"><div><label>Parent / guardian</label><div>${esc(s.parent||'—')}</div></div><div><label>WhatsApp number</label><div>${esc(s.phone||'—')}</div></div><div><label>Date of birth</label><div>${esc(s.dob||'—')}</div></div><div><label>Joining date</label><div>${esc(s.joiningDate||'—')}</div></div><div><label>Payment due date</label><div>${esc(formatDate(s.dueDate))}</div></div><div><label>Notes</label><div>${esc(s.notes||'—')}</div></div></div></div><div class="profile-section"><h3>Recent payments</h3>${payments.length?`<div class="table-wrap"><table><thead><tr><th>Date</th><th>Amount</th><th>Method</th></tr></thead><tbody>${payments.map(p=>`<tr><td>${esc(formatDate(p.date))}</td><td>${money(p.amount)}</td><td>${esc(p.method||'Cash')}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">No payments recorded.</p>'}</div><div class="profile-section"><h3>Recent attendance</h3>${attends.length?attends.map(a=>`<div class="row" style="padding:7px 0;border-bottom:1px solid var(--line)"><span>${esc(a.date)}</span><span>${esc(a.status)}</span></div>`).join(''):'<p class="muted">No attendance recorded.</p>'}</div>`;modal('Student Profile',body,`<button class="light" onclick="closeModal()">Close</button><button class="green" onclick="closeModal();openPaymentForm('${s.id}')">Record payment</button><button class="primary" onclick="closeModal();openStudentForm('${s.id}')">Edit profile</button>${s.active===false?`<button class="primary" onclick="activateStudent('${s.id}')">Activate student</button>`:`<button class="light" onclick="setStudentInactive('${s.id}')">Mark inactive</button>`}<button class="danger" onclick="permanentlyDeleteStudent('${s.id}')">Delete student</button>`)}
function statusBadge(st){return `<span class="badge ${st==='Paid'?'paid':st==='Overdue'?'overdue':'pending'}">${st}</span>`}
function paymentsView(){const pays=[...state.payments].sort((a,b)=>(b.date||'').localeCompare(a.date||''));return `<section class="panel"><div class="panel-head"><div><h2>Payment History</h2><p>Every recorded payment is kept in the ledger. Use Undo if a payment was entered by mistake.</p></div><button class="primary" onclick="openPaymentForm()">＋ Record Payment</button></div><div class="filters"><input id="paymentSearch" placeholder="Search student or receipt…"><input id="paymentMonth" type="month" value="${thisMonth()}"></div><div class="table-wrap mobile-cards payment-cards"><table><thead><tr><th>Date</th><th>Student</th><th>Amount</th><th>Allocated to</th><th>Method</th><th>Note / Receipt</th><th>Action</th></tr></thead><tbody id="paymentRows">${pays.map(p=>{const s=state.students.find(x=>x.id===p.studentId);return `<tr data-pay-name="${esc((s?.name||'Deleted student')+' '+(p.note||'')+' '+p.id).toLowerCase()}" data-pay-month="${esc(p.date?.slice(0,7)||'')}"><td>${esc(formatDate(p.date))}</td><td>${esc(s?.name||'Deleted student')}</td><td><strong>${money(p.amount)}</strong></td><td>${esc(p.allocationLabel||'Current month')}</td><td>${esc(p.method||'Cash')}</td><td>${esc(p.note||'—')}</td><td><button class="danger small" onclick="undoPayment('${p.id}')">Undo / Mark unpaid</button></td></tr>`}).join('')||`<tr><td colspan="7" class="empty">No payments recorded yet.</td></tr>`}</tbody></table></div></section>`}
function attendanceView(){const date=document.getElementById('attendanceDate')?.value||today();const rows=activeStudents();return `<section class="panel"><div class="panel-head"><div><h2>Daily Presence</h2><p>Attendance is stored by exact date.</p></div><button class="primary" onclick="saveAttendance()">Save Attendance</button></div><div class="filters"><label style="min-width:170px">Attendance date (DD/MM/YYYY)<input id="attendanceDate" type="date" lang="en-IN" value="${date}"></label><select id="attendanceBatch"><option value="all">All batches</option>${[...new Set(rows.map(s=>s.batch).filter(Boolean))].map(b=>`<option>${esc(b)}</option>`).join('')}</select><button class="light" onclick="markAll('Present')">Mark all present</button><button class="light" onclick="markAll('Absent')">Mark all absent</button></div><div class="table-wrap mobile-cards presence-cards"><table><thead><tr><th>Student</th><th>Batch</th><th>Mark presence</th><th>Saved status</th></tr></thead><tbody>${rows.map(s=>{const saved=state.attendance.find(a=>a.date===date&&a.studentId===s.id);return `<tr data-att-row="${s.id}" data-att-batch="${esc(s.batch||'')}"><td><strong>${esc(s.name)}</strong></td><td>${esc(s.batch||'—')}</td><td><select class="attendance-status" data-id="${s.id}"><option ${saved?.status==='Present'?'selected':''}>Present</option><option ${saved?.status==='Absent'?'selected':''}>Absent</option><option ${saved?.status==='Late'?'selected':''}>Late</option><option ${!saved?'selected':''}>Not marked</option></select></td><td>${saved?`<span class="badge ${saved.status==='Present'?'paid':saved.status==='Absent'?'overdue':'pending'}">${saved.status}</span>`:'<span class="muted">Not saved</span>'}</td></tr>`}).join('')||`<tr><td colspan="4" class="empty">Add students to take attendance.</td></tr>`}</tbody></table></div><div class="callout" style="margin-top:14px">Present: <b>${state.attendance.filter(a=>a.date===date&&a.status==='Present').length}</b> · Absent: <b>${state.attendance.filter(a=>a.date===date&&a.status==='Absent').length}</b> · Late: <b>${state.attendance.filter(a=>a.date===date&&a.status==='Late').length}</b></div></section>
<section class="panel"><div class="panel-head"><h2>Attendance history</h2><button class="light small" onclick="exportAttendance()">Export CSV</button></div><div class="table-wrap mobile-cards attendance-history-cards"><table><thead><tr><th>Date</th><th>Student</th><th>Status</th></tr></thead><tbody>${[...state.attendance].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,30).map(a=>`<tr><td>${esc(formatDate(a.date))}</td><td>${esc(state.students.find(s=>s.id===a.studentId)?.name||'Deleted student')}</td><td>${statusBadge(a.status==='Present'?'Paid':a.status==='Absent'?'Overdue':'Pending').replace('Paid','Present').replace('Overdue','Absent').replace('Pending','Late')}</td></tr>`).join('')||`<tr><td colspan="3" class="empty">Attendance history will appear here.</td></tr>`}</tbody></table></div></section>`}
function remindersView(){const list=activeStudents().filter(s=>dueTotal(s)>0);return `<section class="panel"><div class="panel-head"><div><h2>Unpaid Fee Reminders</h2><p>${list.length} students have outstanding balances.</p></div><button class="primary" onclick="openBulkReminders()">Prepare bulk reminders</button></div><div class="notice warn">WhatsApp opens message drafts for you to send. This offline app does not silently send messages or schedule background bulk messages. Automated sending requires an approved WhatsApp Business API integration.</div><div class="table-wrap"><table><thead><tr><th><input type="checkbox" id="selectAllReminder" checked style="width:auto"></th><th>Student / Parent</th><th>Phone</th><th>Balance</th><th>Status</th><th>Action</th></tr></thead><tbody>${list.map(s=>`<tr><td><input type="checkbox" class="reminder-check" data-id="${s.id}" checked style="width:auto"></td><td><strong>${esc(s.name)}</strong><div class="muted">${esc(s.parent||'')}</div></td><td>${esc(s.phone||'—')}</td><td>${money(dueTotal(s))}</td><td>${statusBadge(status(s))}</td><td><button class="green small" onclick="openWhatsApp('${s.id}')">Send WhatsApp</button></td></tr>`).join('')||`<tr><td colspan="6" class="empty">No outstanding balances. 🎉</td></tr>`}</tbody></table></div></section>
<section class="panel"><div class="panel-head"><div><h2>1. Fee reminder message</h2><p>Used when you tap WhatsApp on an unpaid student.</p></div></div><p>Fields: {parentGreeting}, {academy}, {student}, {month}, {batch}, {fee}, {paid}, {previousDues}, {balance}, {paidTill}, {totalOutstanding}</p><textarea id="messageTemplate" rows="8">${esc(state.settings.messageTemplate)}</textarea></section><section class="panel"><div class="panel-head"><div><h2>2. Payment confirmation message</h2><p>Used after recording a payment, if you choose to send a receipt message.</p></div></div><p>Fields: {parentGreeting}, {academy}, {student}, {paymentAmount}, {paymentDate}, {paymentMethod}, {previousAllocated}, {currentAllocated}, {totalOutstanding}</p><textarea id="paymentTemplate" rows="8">${esc(state.settings.paymentTemplate||'Hello {parentGreeting} 👋\n\n✅ Payment received by {academy}. Thank you!\n\nStudent: {student}\nAmount received: {paymentAmount}\nPayment date: {paymentDate}\nMethod: {paymentMethod}\nPrevious dues paid: {previousAllocated}\nCurrent-month fee paid: {currentAllocated}\nRemaining outstanding: {totalOutstanding}\n\nThank you!')}</textarea></section><div class="row" style="justify-content:flex-end;margin-bottom:16px"><button class="primary" onclick="saveTemplate()">Save both messages</button></div>`}
function reportsView(){const t=totals(),byMonth={};state.payments.forEach(p=>{const k=p.date?.slice(0,7);if(k)byMonth[k]=(byMonth[k]||0)+Number(p.amount||0)});const rows=Object.keys(byMonth).sort().reverse();return `<div class="grid stats">${statCard('Lifetime Collections',money(state.payments.reduce((a,p)=>a+Number(p.amount||0),0)),'#10b981',`${state.payments.length} transactions`)}${statCard('Outstanding Balance',money(t.outstanding),'#ef4444','Current + previous dues')}${statCard('Attendance Entries',state.attendance.length,'#2563eb','All saved attendance records')}${statCard('Active Students',t.total,'#64748b','Currently enrolled')}</div><section class="panel"><div class="panel-head"><h2>Monthly Collections Report</h2><button class="primary" onclick="exportPayments()">Export payments CSV</button></div><div class="table-wrap"><table><thead><tr><th>Month</th><th>Transactions</th><th>Amount collected</th></tr></thead><tbody>${rows.map(k=>`<tr><td>${monthName(k)}</td><td>${state.payments.filter(p=>p.date?.slice(0,7)===k).length}</td><td><strong>${money(byMonth[k])}</strong></td></tr>`).join('')||`<tr><td colspan="3" class="empty">No collection data yet.</td></tr>`}</tbody></table></div></section><section class="panel"><div class="panel-head"><h2>Outstanding by student</h2><button class="light" onclick="exportStudents()">Export student balances CSV</button></div><div class="table-wrap"><table><thead><tr><th>Student</th><th>Monthly Fee</th><th>Previous Due</th><th>Paid this month</th><th>Total Outstanding</th></tr></thead><tbody>${activeStudents().filter(s=>dueTotal(s)>0).sort((a,b)=>dueTotal(b)-dueTotal(a)).map(s=>`<tr><td>${esc(s.name)}</td><td>${money(s.monthlyFee)}</td><td>${money(s.previousDue)}</td><td>${money(s.paidThisMonth)}</td><td><strong>${money(dueTotal(s))}</strong></td></tr>`).join('')||`<tr><td colspan="5" class="empty">No outstanding balances.</td></tr>`}</tbody></table></div></section>`}
function settingsView(){return `<section class="panel"><div class="panel-head"><div><h2>Academy Settings</h2><p>These details are used in fee reminders.</p></div></div><form id="settingsForm" class="form-grid"><div><label>Academy name</label><input name="academy" required value="${esc(state.academy)}"></div><div><label>Sport</label><input name="sport" value="${esc(state.sport)}"></div><div><label>Monthly rollover day (1–28 recommended)</label><input name="rolloverDay" type="number" min="1" max="28" value="${Number(state.settings.rolloverDay||5)}"></div><div><label>Current month</label><input value="${monthName(thisMonth())}" disabled></div><div class="full notice">Automatic rollover runs when the app is opened on or after the configured day. For guaranteed background execution while the app is closed, a native scheduled task is required.</div><div class="full row"><button class="primary" type="submit">Save settings</button><button class="light" type="button" onclick="runRollover()">Run rollover now</button></div></form></section>

   else if(d.attendance&&typeof d.attendance==='object')Object.entries(d.attendance).forEach(([date,records])=>{
    if(Array.isArray(records))records.forEach(value=>{const studentId=String(value?.studentId||value?.student_id||value?.id||'');const st=value?.status||((value?.present===true)?'Present':(value?.present===false)?'Absent':'');if(studentId&&st)attendance.push({date,studentId,status:st});});
    else if(records&&typeof records==='object')Object.entries(records).forEach(([studentId,value])=>{
     const st=typeof value==='string'?value:(value?.status||((value?.present===true)?'Present':(value?.present===false)?'Absent':''));
     if(st)attendance.push({date,studentId:String(value?.studentId||studentId),status:st});
    });
   });
   const paymentRows=Array.isArray(d.payments)?d.payments:[];
   const payments=paymentRows.map((p,i)=>({
    id:String(p.id||`import-payment-${i}`),studentId:String(p.studentId||p.student_id||''),
    date:p.date||p.paymentDate||today(),amount:Number(p.amount)||0,
    method:p.method||p.paymentMethod||'Cash',previousAllocated:Number(p.previousAllocated)||0,
    currentAllocated:Number(p.currentAllocated)||0,unallocated:Number(p.unallocated)||0,note:p.note||''
   }));
   x={...blankState(),academy:raw.academy||d.academy||'Smash Academy',sport:'Sports',
    students,payments,attendance,
    settings:{...blankState().settings,messageTemplate:d.messageTemplate||blankState().settings.messageTemplate,
      paymentTemplate:d.paymentTemplate||'',rolloverDay:Number(d.rolloverDay)||5},
    rollovers:Array.isArray(d.rollovers)?d.rollovers:[],version:1};
  }
  // Also support exported JSON containing this app's data inside localStorage.
  if(!x&&raw&&raw.data&&typeof raw.data==='object'){
   const nested=raw.data;
   if(nested.version===1&&Array.isArray(nested.students)&&Array.isArray(nested.payments))x=nested;
   else if(raw.storage&&typeof raw.storage==='object'){
    const stored=Object.values(raw.storage).map(v=>{try{return typeof v==='string'?JSON.parse(v):v}catch{return null}}).find(v=>v&&Array.isArray(v.students));
    if(stored)x={...blankState(),...stored,version:1};
   }
  }
  if(!x||!Array.isArray(x.students)||!Array.isArray(x.payments))throw new Error('This JSON backup format was not recognized. Select the Full Data Backup exported by Smash Academy Manager, or a Sports Academy Fees Manager JSON backup.');
  if(!confirm(`Restore backup with ${x.students.length} students and ${x.payments.length} payments? This replaces current local app data.`)){e.target.value='';return;}
  const next={...blankState(),...x,settings:{...blankState().settings,...x.settings}};
  // Validate serialization before changing current state.
  JSON.stringify(next);
  state=next;save();render();showToast(`Backup restored: ${state.students.length} students imported.`);
  if(info)info.textContent=`Restore successful: ${state.students.length} students and ${state.payments.length} payments imported.`;
 }catch(err){
  console.error('Backup restore failed:',err);
  showToast('Could not restore backup. Check the selected JSON file.');
  if(info)info.textContent=`Restore failed: ${err?.message||'unsupported backup format'}. Current data has not been changed.`;
 }finally{e.target.value='';}
});
}
window.addEventListener('pageshow',()=>{try{state=loadState();render()}catch(e){}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){try{state=loadState();render()}catch(e){}}});
init();
</script>
<script>
/* Firebase sign-in + cloud sync. Local storage stays the working copy (offline-first); the cloud mirrors it per user. */
window.__startAuth=()=>{
const ov=document.getElementById('authScreen'),$=id=>document.getElementById(id),L=k=>localStorage.getItem(k),S=(k,v)=>localStorage.setItem(k,v),R=k=>localStorage.removeItem(k);
window.syncText='Not signed in';
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if(!window.FB_ON){ov.classList.add('hidden');return}
if(typeof firebase==='undefined'){ov.classList.add('hidden');if(Date.now()-Number(L('sa_lic')||0)<6048e5){window.syncText='Offline: cloud unavailable';safeRollover();render()}else{$('lockTitle').textContent='Connect to the internet';$('lockMsg').textContent='Please connect to the internet once to confirm your subscription.';$('lockScreen').classList.remove('hidden');$('lockRetry').onclick=()=>location.reload();$('lockOut').classList.add('hidden')}return}
firebase.initializeApp(FIREBASE_CONFIG);
const auth=firebase.auth(),db=firebase.firestore();try{auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(function(){})}catch(e){}try{db.settings({experimentalForceLongPolling:true,experimentalAutoDetectLongPolling:false,merge:true})}catch(e){try{db.settings({experimentalForceLongPolling:true,experimentalAutoDetectLongPolling:false})}catch(e2){console.error(e2)}}
/* Google sign-in popups do not work inside APK wrappers/WebViews: hide that button there, email+password still works */
if(!/^https?:$/.test(location.protocol)||/; wv\)/.test(navigator.userAgent)){$('googleBtn').classList.add('hidden');document.querySelector('.auth-or').classList.add('hidden')}
const DEVICE=L('sa_device')||(()=>{const d=Math.random().toString(36).slice(2)+Date.now().toString(36);S('sa_device',d);return d})();
const CHUNK=250000,pid=i=>'p'+String(i).padStart(3,'0'),hasData=()=>state.students.length||state.payments.length||state.attendance.length;
let user=null,col=null,unsub=null,licUnsub=null,licListUnsub=null,pollT=null,recheck=()=>{},locked=false,lics=[],timer=null,pushing=false,again=false,first=true,done=false,cloudParts=0,prevUid=null,mode='in';
function setSync(t){window.syncText=t;const a=$('sideNote'),b=$('syncInfo');if(a)a.textContent='Offline-first • '+t;if(b)b.textContent=t}
function finish(msg){if(!done){done=true;ov.classList.add('hidden');safeRollover();render()}if(msg)setSync(msg)}
window.cloudQueue=()=>{S('sa_dirty','1');if(!user||locked)return;setSync('Saving…');clearTimeout(timer);timer=setTimeout(push,1500)};
async function push(){
 if(!user||locked)return;if(pushing){again=true;return}
 pushing=true;
 try{
  const json=JSON.stringify(state),parts=[];
  for(let i=0;i<json.length;){let e=Math.min(i+CHUNK,json.length),c=json.charCodeAt(e-1);if(e<json.length&&c>=0xD800&&c<=0xDBFF)e--;parts.push(json.slice(i,e));i=e}
  const ts=Date.now(),b=db.batch();
  parts.forEach((d,i)=>b.set(col.doc(pid(i)),{d}));
  for(let i=parts.length;i<cloudParts;i++)b.delete(col.doc(pid(i)));
  b.set(col.doc('meta'),{updatedAt:ts,device:DEVICE,parts:parts.length,students:state.students.length,payments:state.payments.length});
  await b.commit();cloudParts=parts.length;S('sa_last_sync',String(ts));
  if(!again){R('sa_dirty');setSync('Synced '+new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}))}
 }catch(e){console.error(e);setSync('Sync failed, will retry');setTimeout(()=>L('sa_dirty')&&push(),15000)}
 finally{pushing=false;if(again){again=false;push()}}
}
async function pull(m){
 const docs=await Promise.all(Array.from({length:m.parts},(_,i)=>col.doc(pid(i)).get()));
 if(docs.some(d=>!d.exists))throw new Error('Cloud data incomplete');
 const x=JSON.parse(docs.map(d=>d.data().d).join(''));if(!x||x.version!==1)throw new Error('Unrecognized cloud data');
 state={...blankState(),...x,settings:{...blankState().settings,...x.settings}};
 S(KEY,JSON.stringify(state));S('sa_last_sync',String(m.updatedAt));R('sa_dirty');cloudParts=m.parts;render();setSync('Synced '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}));
}
async function onMeta(snap){
 try{
  const m=snap.exists?snap.data():null,dirty=!!L('sa_dirty');if(m)cloudParts=m.parts||0;
  if(first){
   first=false;
   if(!m){if(hasData()||dirty)await push();else setSync('Synced')}
   else if(!prevUid&&hasData()&&!confirm('Cloud data was found for this account.\n\nOK = load the cloud data on this device.\nCancel = upload this device\'s data and replace the cloud copy.')){await push()}
   else if(!prevUid&&hasData()||(L('sa_last_sync')!==String(m.updatedAt)&&!dirty))await pull(m);
   else if(dirty)await push();
   else setSync('Synced');
   finish();
  }else if(m&&!snap.metadata.hasPendingWrites&&m.device!==DEVICE&&!dirty&&!pushing&&L('sa_last_sync')!==String(m.updatedAt)){await pull(m);showToast('Updated from another device.')}
 }catch(e){console.error(e);setSync('Sync problem: using data on this device');showToast('Cloud sync problem. Your data is safe on this device.');finish()}
}
function startSync(){
 if(unsub)return;first=true;done=false;
 unsub=col.doc('meta').onSnapshot(onMeta,e=>{console.error(e);showToast(e.code==='permission-denied'?'Cloud access denied.':'Could not reach the cloud.');finish('Cloud unavailable: using this device')});
 setTimeout(()=>{if(!done)finish('Offline: saved on this device')},8000);
}
function lock(on,kind){
 locked=on;
 const t={pending:['Waiting for activation','Your account is ready. Ask your app provider to switch it on, then tap Check again.'],off:['Subscription inactive','Access to this app has been switched off. Please contact your app provider.'],offline:['Connect to the internet','Please connect to the internet once to confirm your subscription.']}[kind||'off'];
 if(on){ov.classList.add('hidden');$('lockTitle').textContent=t[0];$('lockMsg').textContent=t[1]}
 $('lockScreen').classList.toggle('hidden',!on);
}
function stopAll(){clearInterval(pollT);recheck=()=>{};[unsub,licUnsub,licListUnsub].forEach(f=>f&&f());unsub=licUnsub=licListUnsub=null;lics=[];locked=false;$('lockScreen').classList.add('hidden')}
function startSession(u){
 user=u;prevUid=L('sa_uid');
 if(prevUid&&prevUid!==u.uid){R(KEY);R('sa_dirty');R('sa_last_sync');state=blankState();prevUid=null}
 S('sa_uid',u.uid);col=db.collection('feesManagerWeb').doc(u.uid).collection('sync');
 ov.classList.remove('hidden');ov.classList.add('loading');setSync('Connecting…');
 const owner=u.uid===OWNER_UID,ref=db.collection('licenses').doc(u.uid);let checked=false;
 if(owner)licListUnsub=db.collection('licenses').onSnapshot(q=>{lics=q.docs.map(d=>({id:d.id,...d.data()})).filter(l=>l.id!==OWNER_UID).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));if(page==='settings')render()});
 const apply=s=>{
  checked=true;
  if(!s.exists&&!owner)ref.set({active:false,email:u.email||'',createdAt:Date.now()}).catch(()=>{});
  if(owner||(s.exists&&s.data().active===true)){S('sa_lic',String(Date.now()));lock(false);startSync()}
  else{if(unsub){unsub();unsub=null}lock(true,s.exists&&s.data().activatedAt?'off':'pending')}
 };
 licUnsub=ref.onSnapshot(apply,e=>{checked=true;lock(true,'off')});
 if(!owner){recheck=()=>{ref.get({source:'server'}).then(apply).catch(()=>{})};pollT=setInterval(()=>{if(!document.hidden)recheck()},30000)}
 setTimeout(()=>{if(!checked){if(Date.now()-Number(L('sa_lic')||0)<6048e5){lock(false);startSync()}else lock(true,'offline')}},8000);
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)recheck()});window.addEventListener('online',()=>recheck());
$('lockRetry').onclick=()=>location.reload();
$('lockOut').onclick=async()=>{if(!confirm('Sign out? Changes not yet saved to the cloud will be lost.'))return;stopAll();R(KEY);['sa_dirty','sa_last_sync','sa_uid','sa_lic'].forEach(R);state=blankState();user=null;await auth.signOut();render()};
window.adminSet=(id,on)=>db.collection('licenses').doc(id).update(on?{active:true,activatedAt:Date.now()}:{active:false}).then(()=>showToast(on?'Academy turned ON.':'Academy turned OFF.')).catch(()=>showToast('Could not update. Check your connection.'));
window.adminDelete=async(id,silent)=>{const l=lics.find(x=>x.id===id);if(!l)return false;if(!silent&&!confirm((l.active?'WARNING: this academy is currently ON (active). ':'')+'Permanently delete '+(l.email||id)+'? This removes their academy record and ALL their cloud data (students, payments, attendance). This cannot be undone.'))return false;try{const q=await db.collection('feesManagerWeb').doc(id).collection('sync').get();let b=db.batch(),n=0;for(const d of q.docs){b.delete(d.ref);if(++n%400===0){await b.commit();b=db.batch()}}await b.commit();await db.collection('feesManagerWeb').doc(id).delete().catch(()=>{});await db.collection('licenses').doc(id).delete();if(!silent)showToast('Academy deleted.');return true}catch(e){console.error(e);showToast('Could not delete '+(l.email||id)+' ('+(e&&e.code||'error')+'). '+(e&&e.code==='permission-denied'?'Your Firestore rules block the owner from deleting.':'Check your connection.'));return false}};
window.adminDeleteAllOff=async()=>{const off=lics.filter(l=>!l.active);if(!off.length)return;if(!confirm('Permanently delete all '+off.length+' OFF academies and their cloud data? This cannot be undone.'))return;let ok=0;for(const l of off){if(await adminDelete(l.id,true))ok++}showToast(ok+' of '+off.length+' academies deleted.')};
const adminPanel=()=>`<section class="panel"><div class="panel-head"><div><h2>Academies (Owner)</h2><p>Turn an academy ON after payment. Turn it OFF to stop their app.</p></div>${lics.some(l=>!l.active)?`<button class="small danger" onclick="adminDeleteAllOff()">Delete all OFF (${lics.filter(l=>!l.active).length})</button>`:''}</div>${lics.length?`<div class="grid">${lics.map(l=>`<div class="callout"><div class="row"><div style="flex:1 1 100%;min-width:0;overflow-wrap:anywhere"><strong>${esc(l.email||l.id)}</strong><br><span class="badge ${l.active?'paid':'overdue'}">${l.active?'ON':'OFF'}</span></div><div style="display:flex;gap:10px;flex:1 1 100%"><button class="small ${l.active?'red':'green'}" style="flex:1" onclick="adminSet('${l.id}',${!l.active})">${l.active?'Turn OFF':'Turn ON'}</button><button class="small danger" style="flex:1" onclick="adminDelete('${l.id}')">Delete</button></div></div></div>`).join('')}</div>`:'<div class="empty">No academies yet. They appear here after they create an account in the app.</div>'}</section>`;
function showAuth(){ov.classList.remove('hidden','loading');$('authPass').value='';msg('')}
const msg=(t,ok)=>{const m=$('authMsg');m.textContent=t||'';m.classList.toggle('ok',!!ok)};
const ERR={'auth/invalid-credential':'Wrong email or password.','auth/wrong-password':'Wrong email or password.','auth/user-not-found':'No account with that email.','auth/email-already-in-use':'That email already has an account. Try signing in.','auth/weak-password':'Use at least 6 characters.','auth/invalid-email':'Enter a valid email address.','auth/too-many-requests':'Too many attempts. Wait a bit and try again.','auth/network-request-failed':'No internet connection.','auth/popup-closed-by-user':'Sign-in was cancelled.','auth/operation-not-allowed':'This sign-in method is not enabled in Firebase yet.','auth/operation-not-supported-in-this-environment':'Use email and password to sign in here.','auth/unauthorized-domain':'Add this website to Firebase Authentication > Authorized domains.'};
const friendly=e=>ERR[e.code]||('Sign-in failed: '+(e.message||e.code));
function setMode(m){mode=m;$('tabIn').classList.toggle('active',m==='in');$('tabUp').classList.toggle('active',m==='up');$('authSubmit').textContent=m==='in'?'Sign in':'Create account';$('authPass').autocomplete=m==='in'?'current-password':'new-password';msg('')}
$('tabIn').onclick=()=>setMode('in');$('tabUp').onclick=()=>setMode('up');
async function run(fn){msg('');$('authSubmit').disabled=true;try{await fn()}catch(e){msg(friendly(e))}finally{$('authSubmit').disabled=false}}
$('authForm').addEventListener('submit',e=>{e.preventDefault();const em=$('authEmail').value.trim(),pw=$('authPass').value;run(()=>mode==='in'?auth.signInWithEmailAndPassword(em,pw):auth.createUserWithEmailAndPassword(em,pw))});
$('googleBtn').onclick=()=>run(()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()));
$('forgotBtn').onclick=()=>run(async()=>{const em=$('authEmail').value.trim();if(!em)return msg('Enter your email above first.');await auth.sendPasswordResetEmail(em);msg('Password reset email sent. Check your inbox.',true)});
window.accountPanelHtml=()=>user?`<section class="panel"><div class="panel-head"><div><h2>Account & Cloud Sync</h2><p>Signed in as <strong>${esc(user.email||user.displayName||'your account')}</strong></p></div></div><div class="callout" id="syncInfo">${esc(window.syncText)}</div><div class="row" style="margin-top:12px"><button class="light" onclick="cloudSyncNow()">↻ Sync now</button><button class="danger" onclick="cloudSignOut()">Sign out</button></div></section>`+(user.uid===OWNER_UID?adminPanel():''):'';
window.cloudSyncNow=async()=>{if(!user)return;try{if(L('sa_dirty'))return push();const s=await col.doc('meta').get({source:'server'});if(s.exists&&L('sa_last_sync')!==String(s.data().updatedAt)){await pull(s.data());showToast('Updated from cloud.')}else showToast('Already up to date.')}catch(e){showToast('Could not reach the cloud. Check your connection.')}};
window.cloudSignOut=async()=>{
 clearTimeout(timer);for(let i=0;i<12&&(L('sa_dirty')||pushing);i++){if(!pushing)push();await new Promise(r=>setTimeout(r,500))}
 if(!confirm(L('sa_dirty')?'Some changes have not reached the cloud yet and will be lost if you sign out. Sign out anyway?':'Sign out of this device? Your data stays saved in your cloud account.'))return;
 stopAll();
 R(KEY);['sa_dirty','sa_last_sync','sa_uid'].forEach(R);state=blankState();user=null;await auth.signOut();render();
};
let authFired=false;
/* Safety net: if Firebase never answers the sign-in check (slow network / WebView storage issue), stop waiting */
setTimeout(()=>{if(authFired)return;authFired=true;const u=auth.currentUser;if(u){stopAll();startSession(u)}else if(L('sa_uid')){ov.classList.add('hidden');window.syncText='Offline: waiting for sign-in';safeRollover();render()}else{user=null;setSync('Not signed in');showAuth();msg('Sign-in check is slow. Check your internet, then sign in.')}},6000);
auth.onAuthStateChanged(u=>{authFired=true;stopAll();if(u)startSession(u);else{user=null;setSync('Not signed in');showAuth()}},e=>{console.error(e);if(!authFired){authFired=true;showAuth();msg('Could not check sign-in. Please sign in again.')}});
};
</script>
<script>
/* Loads the Firebase SDK with timeouts and a backup source, so a slow or hanging download can never freeze the first screen */
(function(){
var SRC=['https://www.gstatic.com/firebasejs/10.14.1/','https://cdn.jsdelivr.net/npm/firebase@10.14.1/'];
function load(u,ms){return new Promise(function(res,rej){var s=document.createElement('script'),t=setTimeout(function(){s.onload=s.onerror=null;s.remove();rej(new Error('timeout'))},ms);s.onload=function(){clearTimeout(t);res()};s.onerror=function(){clearTimeout(t);s.remove();rej(new Error('error'))};s.src=u;document.head.appendChild(s)})}
async function go(){
 for(var i=0;i<SRC.length;i++){
  try{
   if(typeof firebase==='undefined')await load(SRC[i]+'firebase-app-compat.js',6000);
   await Promise.all([
    typeof firebase.auth==='function'?0:load(SRC[i]+'firebase-auth-compat.js',6000),
    typeof firebase.firestore==='function'?0:load(SRC[i]+'firebase-firestore-compat.js',6000)
   ]);
   if(typeof firebase.auth==='function'&&typeof firebase.firestore==='function')break;
  }catch(e){}
 }
 if(typeof firebase!=='undefined'&&!(typeof firebase.auth==='function'&&typeof firebase.firestore==='function'))window.firebase=undefined;
 try{window.__startAuth()}catch(e){console.error(e)}
}
go();
})();
</script>
<script>
/* Last-resort watchdog: never stay on "Checking sign-in..." forever, even if Firebase scripts hang or fail to load */
setTimeout(function(){var o=document.getElementById('authScreen');if(o&&!o.classList.contains('hidden')&&o.classList.contains('loading')){o.classList.remove('loading');var m=document.getElementById('authMsg');if(m)m.textContent='Taking too long. Check your internet connection and try again.'}},20000);
</script>
